version: "3.8"

# `docker compose up -d` starts PostgreSQL and Mailpit for local development
# (run the app itself with ./mvnw spring-boot:run).
# `docker compose --profile app up -d --build` also builds and runs the API.

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: opus_db
    environment:
      POSTGRES_DB: ${DB_NAME:-opus_db}
      POSTGRES_USER: ${DB_USER:-opus_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-opus_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-opus_user} -d ${DB_NAME:-opus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: opus_mailpit
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"

  app:
    profiles: ["app"]
    build: .
    image: opus-api:local
    container_name: opus_api
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Secrets and tuning (JWT_SECRET, OTP_PEPPER, CORS_ALLOWED_ORIGINS, ...)
    # come from .env when it exists; the values below always win.
    env_file:
      - path: .env
        required: false
    environment:
      # dev,seed gives a ready-to-test API with demo data and Mailpit email.
      # For a real deployment set APP_PROFILES=prod and supply its secrets.
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-dev,seed}
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres_data:
