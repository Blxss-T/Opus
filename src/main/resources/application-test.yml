spring:
  datasource:
    url: jdbc:h2:mem:opus_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host:

security:
  google:
    allow-mock-tokens: true
  otp:
    pepper: test-otp-pepper

logging:
  level:
    root: WARN
    com.opsflow: INFO
