spring:
  datasource:
    url: jdbc:h2:mem:opus_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  mail:
    host:

security:
  cors:
    allowed-origins: http://localhost:3000
  google:
    allow-mock-tokens: true
  otp:
    pepper: test-otp-pepper
  rate-limit:
    enabled: false
    fail-closed: false
  step-up:
    enabled: false

opus:
  cache:
    enabled: false
  jobs:
    enabled: false
    reporting-refresh-ms: 0
    otp-cleanup-ms: 0

logging:
  level:
    root: WARN
    com.opsflow: INFO
