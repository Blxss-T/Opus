spring:
  application:
    name: opus
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opus_db}
    username: ${DB_USER:opus_user}
    password: ${DB_PASSWORD:opus_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}
  # Set to "native" when running behind a reverse proxy so the client IP
  # (used for rate limiting) comes from X-Forwarded-For of trusted proxies.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

opus:
  mail:
    # true: a missing mail server or failed delivery is an error (prod default).
    # false: fall back to logging so local development works without SMTP.
    fail-on-error: ${MAIL_FAIL_ON_ERROR:false}

security:
  jwt:
    secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}  # access token lifetime; 15 minutes
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:10080}  # minutes; 7 days
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    limit: ${RATE_LIMIT_LIMIT:10}     # requests per window per IP per endpoint
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  api-keys:
    rate-limit:
      enabled: ${API_KEY_RATE_LIMIT_ENABLED:true}
      limit: ${API_KEY_RATE_LIMIT:120}  # requests per window per API key, across all endpoints
      window-seconds: ${API_KEY_RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}  # comma-separated; empty disables cross-origin access
  google:
    client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
    allow-mock-tokens: ${GOOGLE_ALLOW_MOCK_TOKENS:false}
  otp:
    pepper: ${OTP_PEPPER:opus-otp-dev-pepper}
