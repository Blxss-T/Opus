spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

opus:
  cache:
    enabled: false
  jobs:
    enabled: false
    reporting-refresh-ms: 0
    otp-cleanup-ms: 0

security:
  google:
    allow-mock-tokens: true
  step-up:
    enabled: false

logging:
  level:
    root: WARN
    com.opsflow: INFO
